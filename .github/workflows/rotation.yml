name: 可转债每周轮动推送

# 每天多次触发（北京时间 13:00 / 15:00 / 17:00），由 notify.py 判定：
#   - 本周最后交易日（如周五，或节假日前最后一个开市日）14:00 后推送；
#   - GitHub 定时器若某次没触发/延迟，后续任意一次运行都会自动补推（本周已推则去重）；
#   - 周末也保留触发，用于兜底补推（例如周五全部遗漏，周六/周日也能补上）。
on:
  schedule:
    - cron: '0 5 * * *'   # UTC 05:00 = 北京 13:00
    - cron: '0 7 * * *'   # UTC 07:00 = 北京 15:00
    - cron: '0 9 * * *'   # UTC 09:00 = 北京 17:00
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（跳过交易日判定），填 true'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly rotation push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ROTATION_FORCE: ${{ inputs.force }}
        run: python notify.py --rotation

      # 轮动推送会更新 last_strategies.json，需回写仓库以便下次轮入/轮出比对。
      # 该文件在 .gitignore 中，必须用 -f 强制添加（首次入库后即成为跟踪文件）。
      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_strategies.json holiday_cache.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: update rotation snapshot [skip ci]"
            git push
          fi
