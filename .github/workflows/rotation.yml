name: 可转债每周轮动推送

# 轮动推送已并入 refresh.yml（每 15 分钟刷新时顺带判定），本工作流仅保留「手动补推」入口：
# 每周轮动在 refresh.yml 里执行，避免独立 schedule 在最后交易日 14:00 后恰好被 GitHub
# 漏触发而整周不推。需要临时补推时用 workflow_dispatch 手动运行本工作流即可。
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（跳过交易日判定），填 true'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly rotation push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          JISILU_COOKIE: ${{ secrets.JISILU_COOKIE }}
          ROTATION_FORCE: ${{ inputs.force }}
        run: python notify.py --rotation

      # 轮动推送会更新 last_strategies.json，需回写仓库以便下次轮入/轮出比对。
      # 该文件在 .gitignore 中，必须用 -f 强制添加（首次入库后即成为跟踪文件）。
      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_strategies.json holiday_cache.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: update rotation snapshot [skip ci]"
            git push
          fi
