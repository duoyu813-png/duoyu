name: 可转债每周轮动推送

# 每周「最后一个交易日」14:00（北京时间）推送轮动。
# 工作日 周一~周五 每天触发（UTC 06:00 = 北京 14:00），由 notify.py 判定
# 今天是否为本周最后一个交易日：若周五逢节假日休市，则提前到本周最后开市日
# （如 9/25 周五中秋休市 -> 周四 9/24）推送，从而自动避开节假日。
# 独立于 refresh.yml 的每日折价推送。
on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（跳过交易日判定），填 true'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly rotation push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ROTATION_FORCE: ${{ inputs.force }}
        run: python notify.py --rotation

      # 轮动推送会更新 last_strategies.json，需回写仓库以便下次轮入/轮出比对。
      # 该文件在 .gitignore 中，必须用 -f 强制添加（首次入库后即成为跟踪文件）。
      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f last_strategies.json holiday_cache.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: update rotation snapshot [skip ci]"
            git push
          fi
