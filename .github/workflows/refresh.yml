name: Refresh Dashboard

on:
  schedule:
    # 交易时段每 30 分钟刷新一次（UTC：中国 08:30-14:00 对应 00:30-06:00 UTC，加上 15:00-16:00 尾盘）
    # 覆盖全天候 + 简化：每 30 分钟刷新（免费公共仓库 Actions 无限分钟）
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 手动触发刷新
        required: false
        default: 'true'
      cb_alert_force:
        description: '强制发送可转债低价/低溢价推送(忽略交易时段), 填 true'
        required: false
        default: 'false'

# 公共仓库 Pages 部署权限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate static dashboard
        env:
          JISILU_COOKIE: ${{ secrets.JISILU_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python sitegen.py

      - name: Generate qiangquan scoring board
        env:
          JISILU_COOKIE: ${{ secrets.JISILU_COOKIE }}
        run: python qiangquan_gen.py || echo "qiangquan generation failed, keeping last snapshot"

      - name: Send CB low price/premium alert
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          CB_ALERT_FORCE: ${{ inputs.cb_alert_force }}
        run: python notify.py --cb-alert || echo "cb-alert skipped (non-trading window / no data)"

      - name: Send CB issue progress change alert
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python notify.py --progress || echo "progress skipped (no change / no data)"

      - name: Commit fallback cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hanquan/last_qiangquan.json last_cb_alerts.json last_issues.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: update qiangquan fallback cache"
            git push
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4