name: 每日折价推送

# 定时微信推送（PushPlus）
# UTC 时区换算（北京 = UTC+8）：
#   每天 20:00 折价推送 -> cron '0 12 * * *'（UTC 12:00 = 北京 20:00）
#   （每周五 14:00 可转债轮动推送已拆到独立文件 rotation.yml，
#     避免定时任务排期延迟时用运行时刻猜任务类型导致误判）
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '手动触发推送类型: test/discount/issues/cb-alert（轮动请用 rotation.yml）'
        required: false
        default: 'discount'
      cb_alert_force:
        description: 'cb-alert 强制发送(忽略交易时段), 填 true'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled discount push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          JISILU_COOKIE: ${{ secrets.JISILU_COOKIE }}
          CB_ALERT_FORCE: ${{ inputs.cb_alert_force }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -n "$MODE" ]; then
            echo "手动触发推送: $MODE"
            python notify.py --$MODE
          else
            python notify.py --discount
          fi

      # 手动 --cb-alert / --issues 等会更新快照文件，回写仓库以便下次比对
      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: update snapshot files"
            git push
          fi
